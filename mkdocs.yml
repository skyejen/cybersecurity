site_name: skyejen / cybersecurity
site_url: https://skyejen.github.io/cybersecurity
site_description: Cybersecurity learning write-ups by Jen
site_author: skyejen

repo_name: skyejen/cybersecurity
repo_url: https://github.com/skyejen/cybersecurity

theme:
  name: material
  custom_dir: overrides
  palette:
    - scheme: slate
      primary: custom
      accent: custom
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
    - toc.follow
  logo: images/cybersecurity-v4-1.png
  favicon: images/cybersecurity-v4-1.png
  icon:
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/extra.js

markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      linenums: true
  - pymdownx.inlinehilite
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

copyright: >-
  <span class="md-copyright__highlight">© 2026 Jennifer Skye</span>
  &nbsp;·&nbsp; stay curious. keep breaking.

extra:
  generator: false

plugins:
  - search

hooks:
  - hooks/writeup_counts.py

nav:
  - TryHackMe:
    - Cyber Security 101:
      - tryhackme/cyber-security-101/index.md
      - Exams:
        - SEC1 Exam: tryhackme/cyber-security-101/write-ups/sec1-exam-write-up.md
      - Cryptography:
        - Hashing Basics: tryhackme/cyber-security-101/write-ups/cryptography/hashing-basics.md
      - Defensive Security:
        - Defensive Security: tryhackme/cyber-security-101/write-ups/defensive-security/defensive-security.md
      - Defensive Security Tooling:
        - CAPA The Basics: tryhackme/cyber-security-101/write-ups/defensive-security-tooling/capa-the-basics.md
        - CyberChef The Basics: tryhackme/cyber-security-101/write-ups/defensive-security-tooling/cyberchef-the-basics.md
        - REMnux Getting Started: tryhackme/cyber-security-101/write-ups/defensive-security-tooling/remnux-getting-started.md
      - Exploitation Basics:
        - Blue: tryhackme/cyber-security-101/write-ups/exploitation-basics/blue.md
        - Metasploit Exploitation: tryhackme/cyber-security-101/write-ups/exploitation-basics/metasploit-exploitation.md
      - Offensive Security Tooling:
        - Shells Overview: tryhackme/cyber-security-101/write-ups/offensive-security-tooling/shells-overview.md
        - SQLMap The Basics: tryhackme/cyber-security-101/write-ups/offensive-security-tooling/sqlmap-the-basics.md
      - OWASP Top 10 2025:
        - Application Design Flaws: tryhackme/cyber-security-101/write-ups/owasp-top-10-2025/owasp-top-10-2025-application-design-flaws.md
        - IAAA Failures: tryhackme/cyber-security-101/write-ups/owasp-top-10-2025/owasp-top-10-2025-iaaa-failures.md
        - Insecure Data Handling: tryhackme/cyber-security-101/write-ups/owasp-top-10-2025/owasp-top-10-2025-insecure-data-handling.md
      - Security Solutions:
        - Firewall Fundamentals: tryhackme/cyber-security-101/write-ups/security-solutions/firewall-fundamentals.md
        - IDS Fundamentals: tryhackme/cyber-security-101/write-ups/security-solutions/ids-fundamentals.md
        - Vulnerability Scanner Overview: tryhackme/cyber-security-101/write-ups/security-solutions/vulnerability-scanner-overview.md
      - Web Hacking:
        - Burp Suite The Basics: tryhackme/cyber-security-101/write-ups/web-hacking/burp-suite-the-basics.md
    - Jr Penetration Tester:
      - tryhackme/penetration-tester/jr-penetration-tester/index.md
      - Penetration Testing Foundations:
        - Guided Pentest Web: tryhackme/penetration-tester/jr-penetration-tester/penetration-testing-foundations/guided-pentest-web/guided-pentest-web.md
        - Guided Pentest Infrastructure: tryhackme/penetration-tester/jr-penetration-tester/penetration-testing-foundations/guided-pentest-infrastructure/guided-pentest-infrastructure.md
    - Side Quests:
      - tryhackme/side-quests/index.md
      - Ninja Skills: tryhackme/side-quests/ninja-skills/ninja-skills.md
