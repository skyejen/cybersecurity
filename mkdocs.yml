        'tryhackme/side-quests/index.md': 'learning/tryhackme/side-quests/index.md'
        'tryhackme/side-quests/ninja-skills/ninja-skills.md': 'learning/tryhackme/side-quests/standalone-challenges/ninja-skills/ninja-skills.md'
        'learning/tryhackme/side-quests/ninja-skills/ninja-skills.md': 'learning/tryhackme/side-quests/standalone-challenges/ninja-skills/ninja-skills.md'

