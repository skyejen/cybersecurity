site_name: skyejen / cybersecurity
site_url: https://skyejen.github.io/cybersecurity
site_description: Cybersecurity learning write-ups by Jen
site_author: skyejen

repo_name: skyejen/cybersecurity
repo_url: https://github.com/skyejen/cybersecurity

# Local dev server address (so all three sites can run side by side)
dev_addr: 127.0.0.1:8001

theme:
  name: material
  custom_dir: overrides
  palette:
    - scheme: slate
      primary: custom
      accent: custom
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
    - toc.follow
  logo: images/cybersecurity-v4-1.png
  favicon: images/cybersecurity-v4-1.png
  icon:
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/extra.js

markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tilde
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

copyright: >-
  <span class="md-copyright__highlight">© 2026 Jennifer Skye</span>
  &nbsp;·&nbsp; stay curious. keep breaking.

extra:
  generator: false

plugins:
  - search
  # Keep old learning URLs alive after the portfolio/learning restructure
  # (everything under tryhackme/ moved to learning/tryhackme/).
  - redirects:
      redirect_maps:
        'tryhackme/cyber-security-101/index.md': 'learning/tryhackme/cyber-security-101/index.md'
        'tryhackme/cyber-security-101/write-ups/sec1-exam-write-up.md': 'learning/tryhackme/cyber-security-101/write-ups/sec1-exam-write-up.md'
        'tryhackme/cyber-security-101/write-ups/cryptography/hashing-basics.md': 'learning/tryhackme/cyber-security-101/write-ups/cryptography/hashing-basics.md'
        'tryhackme/cyber-security-101/write-ups/defensive-security/defensive-security.md': 'learning/tryhackme/cyber-security-101/write-ups/defensive-security/defensive-security.md'
        'tryhackme/cyber-security-101/write-ups/defensive-security-tooling/capa-the-basics.md': 'learning/tryhackme/cyber-security-101/write-ups/defensive-security-tooling/capa-the-basics.md'
        'tryhackme/cyber-security-101/write-ups/defensive-security-tooling/cyberchef-the-basics.md': 'learning/tryhackme/cyber-security-101/write-ups/defensive-security-tooling/cyberchef-the-basics.md'
        'tryhackme/cyber-security-101/write-ups/defensive-security-tooling/remnux-getting-started.md': 'learning/tryhackme/cyber-security-101/write-ups/defensive-security-tooling/remnux-getting-started.md'
        'tryhackme/cyber-security-101/write-ups/exploitation-basics/blue.md': 'learning/tryhackme/cyber-security-101/write-ups/exploitation-basics/blue.md'
        'tryhackme/cyber-security-101/write-ups/exploitation-basics/metasploit-exploitation.md': 'learning/tryhackme/cyber-security-101/write-ups/exploitation-basics/metasploit-exploitation.md'
        'tryhackme/cyber-security-101/write-ups/offensive-security-tooling/shells-overview.md': 'learning/tryhackme/cyber-security-101/write-ups/offensive-security-tooling/shells-overview.md'
        'tryhackme/cyber-security-101/write-ups/offensive-security-tooling/sqlmap-the-basics.md': 'learning/tryhackme/cyber-security-101/write-ups/offensive-security-tooling/sqlmap-the-basics.md'
        'tryhackme/cyber-security-101/write-ups/owasp-top-10-2025/owasp-top-10-2025-application-design-flaws.md': 'learning/tryhackme/cyber-security-101/write-ups/owasp-top-10-2025/owasp-top-10-2025-application-design-flaws.md'
        'tryhackme/cyber-security-101/write-ups/owasp-top-10-2025/owasp-top-10-2025-iaaa-failures.md': 'learning/tryhackme/cyber-security-101/write-ups/owasp-top-10-2025/owasp-top-10-2025-iaaa-failures.md'
        'tryhackme/cyber-security-101/write-ups/owasp-top-10-2025/owasp-top-10-2025-insecure-data-handling.md': 'learning/tryhackme/cyber-security-101/write-ups/owasp-top-10-2025/owasp-top-10-2025-insecure-data-handling.md'
        'tryhackme/cyber-security-101/write-ups/security-solutions/firewall-fundamentals.md': 'learning/tryhackme/cyber-security-101/write-ups/security-solutions/firewall-fundamentals.md'
        'tryhackme/cyber-security-101/write-ups/security-solutions/ids-fundamentals.md': 'learning/tryhackme/cyber-security-101/write-ups/security-solutions/ids-fundamentals.md'
        'tryhackme/cyber-security-101/write-ups/security-solutions/vulnerability-scanner-overview.md': 'learning/tryhackme/cyber-security-101/write-ups/security-solutions/vulnerability-scanner-overview.md'
        'tryhackme/cyber-security-101/write-ups/web-hacking/burp-suite-the-basics.md': 'learning/tryhackme/cyber-security-101/write-ups/web-hacking/burp-suite-the-basics.md'
        'tryhackme/penetration-tester/jr-penetration-tester/index.md': 'learning/tryhackme/penetration-tester/jr-penetration-tester/index.md'
        'tryhackme/penetration-tester/jr-penetration-tester/penetration-testing-foundations/guided-pentest-web/guided-pentest-web.md': 'learning/tryhackme/penetration-tester/jr-penetration-tester/penetration-testing-foundations/guided-pentest-web/guided-pentest-web.md'
